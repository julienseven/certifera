name: Certifera CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate Next.js types
        run: npx next typegen
      - name: TypeScript validation
        run: npm exec tsc -- --noEmit --pretty false
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Verify migrations match schema.ts
        # `generate` writes a new file when the committed migrations do not
        # reproduce schema.ts. A dirty tree here means someone edited the schema
        # without generating the migration that carries the change to
        # production, which push --force used to paper over at deploy time.
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::schema.ts has drifted from ./drizzle. Run 'npm run db:generate' and commit the migration."
            git --no-pager status --porcelain -- drizzle
            exit 1
          fi
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
